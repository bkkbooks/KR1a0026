body:
  text: 易璇璣卷上宋吳沆撰法天篇第一法天之道可以修身可以治人而美化日新道莫大乎天德莫大乎地仁莫盛乎春智莫盛乎水信以為常宅乎中央行之有漸愈久而彌光天運無窮以其剛君道乃昌地載不極以其方臣道乃長君道備乎乾臣道備乎坤地有常卑天有常尊照如日月則無不明也分如星辰則無不經也威如雷霆則無不懲也政如四時則無不成也日月之照在不私星辰之位在不移雷霆之怒在不失其時四時之序在順而行之蓋天得於陽地得於隂人兼陽而兼隂天一於動地一於靜人能動而能靜天體於剛地體於柔人有剛而有柔人之在天地其猶神之在心乎是故可以理萬物可以成四時可以反否泰可以權安危天有不能施地有不能生人有不能成天地有神人實靈之天地有理人實明之天地有化人實輔而行之是故火不能濡水不能熱澤不能棲山不能浴風不足以震龍蛇雷不足以靡草木山澤有美矣待人而後施風雷有施矣待人而後利水火有利矣待人而有濟有之者物也用之者人也居其上而為之宰使各當焉者君也通其變使民由之而不知其所以然者神也天以肅殺為仁地以朽壤為珍道以疏逺為親易以簡易為勤不離乎雜不歸之純不昧於物不明乎真天道雖逺在反求諸身通六子篇第二天有其時地有其利人有其智六子之用以通為貴是故坎無常險離無常明艮不必止巽不必行震動有機也兊説有宜也施而不當則悔吝隨之也坎之險一也遇健則訟遇順則師離之麗一也與雷則噬嗑與澤則睽蓋水懼乎塞貴乎通上山為蹇下山為蒙火利乎髙不利乎卑出地為晉入地為明夷觀乎比則知就下之勢唯然也觀乎同人則知炎上之勢唯然也是故禮欲顯而明智欲通而利明乎水火禮智之紀天下之止本無常理天下之行本無常形觀其四陽方退二隂方興當是之時艮亦能行一隂得位三陽受制當是之時巽亦能止及其五隂在下一陽在上其勢將傾剝及其廬則雖艮有不能止也五陽在上一隂在下其勢將遇柔道既牽則雖巽有不能行也是故木居山而為漸居地而為升巽水則為汲巽火則為烹山落風而為蠱飾火而為賁大畜則藏天謙光則隱地益與時而偕行蹇見險而能止動有不可置也説有不獲已也動則免險不動則屯雖欲不動而微因説則應乎乾不説則見嘻而凶雖欲不説而奚從方其天下雷行動不可妄則雖動而見違上火下澤二志乖睽則雖説而見疑是故有兊以吉有兊以疾有震而厲有震而泥和兊以初而獲吉者陽處卑而説人以正也來兊以三而獲凶者隂犯分而説人以佞也初九一震而其來甚厲豈非陽得位而動於內故乎九四再震而道迄未光豈非陽失位而動於外故乎然則震以不妄為機兊以不苟為宜如驚雷之發如膏澤之施無有小大必謹其時是故坎失之困離失之睽震失之壯兊失之隨巽得於觀艮得於頤六子之用非言可期用失其道則無不虧用得其道則無不宜貴中篇第三上下之理貴乎中通聖賢之道貴乎中庸是故一卦之內有二中焉五位正陽天之中也二位正隂地之中也天地之中君臣之正位也苟得其中否剝亦吉苟失其中泰復亦凶否之九五曰休否大人吉剝之六五曰貫魚以宫人寵無不利是否剝得中亦有時而吉也泰在三則曰無平不陂在上則曰城復于隍復在三則曰頻復厲在上則曰迷復凶是泰復失中亦有時而凶也否者亂之極泰者治之極剝者陽之窮復者陽之通卦之吉莫甚於泰復卦之凶莫甚於否剝而中之為道得失相反乃至於此況其餘哉歷觀諸卦大抵以中為貴是故比以中而顯謙以中而鳴臨以中而知節以中而甘蒙以發師以吉萃以聚升以亨漸以正邦渙以有廟兊以應人蠱以幹母自考者復也朋來者蹇也利用獄者噬嗑也晉以受福益以有慶姤以含章履以光明未亡者豫也無喪者震也不敗者大有也旅巽以之小亨而離訟以之元吉以至坎之心損之志艮之輔鼎之耳井之寒泉需之酒食豐以弗憂夬以勿恤恆悔以亡屯正以吉孚鶴以鳴解狐以獲歸妹之行家人之饋大觀之在上同人君子之正困大人之吉孰有不由中而致然者如睽之卦以柔而得中則小事吉也小過之卦以剛而失中則不可大事也輿説輻一也在小畜之三則不免反目在大畜之二則終於無尤曳其輪一也在既濟之初則僅能無咎在未濟之二則遂獲中正之吉為利一至此乎故一卦之內有一言中者有再言中者有三言中者在二而言者九乾謙蠱大畜恆大壯晉家人損在五而言者六坤隨復震艮歸妹二五俱言者三泰豫夬在彖獨言者十有四蒙觀噬嗑無妄大過睽益升漸旅兊渙中孚小過彖二俱言者九小畜履大有離解萃中孚既濟未濟彖五俱言者九訟比同人臨蹇姤井鼎節彖二五俱言者五需師坎困巽有曰剛中也柔中也中正正中也在中得中也中道中行中直也所以為中則異而為吉則同也易之為道非中則正而言正者猶有所謂可正有不可正有不可疾正有利君子正有不利君子正有曰艱正正厲正凶正吝至於言中乃未有言利不利可不可者亦無所謂艱厲凶吝之辭是正有時而不可中無時而不可也歷觀六十四卦而言中者乃五十有五其不言者特否剝屯頤咸革賁遁明夷九卦而已否剝雖不言中而爻之得中亦未嘗不吉故知易之為道貴中而已也法言云龍之潛亢不獲其中矣是以過中則惕不及中則躍是乾道以中為貴也文言曰君子黃中通理正位居體美在其中而暢於四支發於事業美之至也是坤道以中為貴也為人君者將體乾效坤以治天下之民而以中道行之不亦宜乎不亦善乎初上定位篇第四卦可修德象可制器初上有隂陽定位卦之可以修德者多矣而孔子特取其九者舉其九也象之可以制器者亦多矣而孔子特取其十有三者舉其十有三也初上皆有隂陽定位而孔子特言其二四三五者舉其二四三五也孔子曰舉一隅不以三隅反則不復也而況舉其四乃不能明其二乎故以二四同功則上之為隂亦可知也以三五同功則初之為陽亦可知也繫辭云分隂分陽迭用柔剛故易六位而成章則三極之道互備隂陽蓋昭然矣若初上而無定位則隂陽不得言分剛柔不得言迭用而所以成章者乃不過四位而已何六之有案六十四卦去初上而得位者凡三曰漸曰蹇曰家人而彖未嘗言其位之當者必於既濟一卦自初及上六位隂陽一一皆得然後曰剛柔正而位當則意可知矣孔子論爻之際特舉二四三五而不及此者蓋不當用事之地其功不足道焉故也子曰其初難知其上易知非謂無隂陽定位也謂其禍福未形特不可預料而知耳是故乾初謂之潛過五謂之亢雖謂之潛何害為陽既過五矣何位之有在需亦然蓋需之為需飲食宴樂在五一爻而已過五在上雖不當位亦其宜也所謂位者蓋指九五而言非謂隂陽之位當與否也先儒疑焉蓋畏聖人之過也若以初爻不言得位失位為疑則二爻亦未嘗言之使孔子不舉二四又將疑乎故曰卦可修德象可制器初上有隂陽定位六九定名篇第五一元肇判立極成乾數明於後象表於前求其至當未有不出於自然者也是故七八九六之數見於揲蓍之餘而隂陽老少之名定於河圖之初今案河圖自左而旋地六位於西北其地為慘殺之極其時為秋冬之交隂盡於亥而一陽生故過於地六而天一位焉是知隂老於六天九位於南方其地為文明之極其時為盛夏之月陽盡于已而一隂生故過於天九而地二位焉故曰陽老於九陽得四正故天九進居於午隂得四維故地二退處於未此蓋君臣盈謙自然之勢然亦不害其為陽老於已而隂生於午也陽極則將變於隂故老陽之爻為重隂極則將變於陽故老隂之爻為交自六九而外又間一位而數之則地八自當為少隂天七自當為少陽此皆天地自然之象也以揲蓍之餘四四而數之得九則其䇿三十有六而為老陽得六則其䇿二十有四而為老隂以至得七為少陽得八為少隂此皆天地自然之數也繫辭云參天兩地而倚數蓋合地二與四以為六而為老隂合天一三五以為九而為老陽又合六九之數從橫數之皆十有五而為河圖又以天一以至地十合數五十有五而為洛書是故大衍之數起於洛書而六九之名定於河圖謂之象數無非出於自然者聖人因自然之數以推自然之象因自然之象以定自然之名未始妄以人事加之故曰河出圖洛出書聖人則之若象也數也而可以人事加之則所謂象與數也特未定也而何貴於易哉天地變卦篇第六八卦定位配之四方重以六爻上下成章中分天地互備隂陽在天常轉在地常寧位之所易卦之所生轉歷七位八八齊成故知變卦之道出于自然而非偶然也繫辭云天尊地卑乾坤定矣又曰動靜有常剛柔斷矣則知動靜剛柔蓋指天地而言也又曰剛柔相摩八卦相蕩則知天剛地柔上動下靜八卦相摩以成六十四也戴記云隂陽相摩天地相蕩不言剛柔而言隂陽不言八卦而言天地所以通其意也是故六十四卦日運乎天生生相續隨變而遷通乎晝夜其道自然固不必天與地交而後為泰不交而後為否水在火上而後為既濟水在火下而後為未濟也俯仰之間而卦變備焉故曰易之為道也屢遷變動不居周流六虛非天運無已其孰能知求易之道而安可拘故有時而然者卦之用也無時而不然者卦之體也兼乎體用無所不通者聖人作易之旨也是故六爻之位雖體三才而二卦之重實象天地亦猶子兼父母之偏而父母之體未嘗不全也人兼天地以存而天地之位未嘗不分也故自三才而言則分隂分陽迭用柔剛自天地而言則天兼兩隂地兼兩陽地正位乎柔天正位乎剛以少者為之主而中者為之體也先儒云內卦為正外卦為悔知其為內外矣而未知其所以正悔也蓋外卦為天內卦為地天動而地靜靜者常失之柔動者常失之剛柔者邪之所自入動者悔之所以生曰正曰悔所以為動靜剛柔之戒而已觀乎內外則知卦之有二體也觀乎動靜則知內外之為天與地也觀乎天地則知卦變之道出於自然而非偶然也論變有四篇第七易變有四卦變其始爻變其次倒卦不足又繼之以反類舍是以還則存乎互體而已乾得坎而為需坤得坎而為比此以卦變者也一隂生而為姤一陽生而為復此以爻變者也反泰而為否易坎而為離此以倒卦反類而變者也去賁之初則有坎坎為水故九三有濡如之象去賁之二則有震震為馬故六四有乘馬之象此互卦之體而變者也卦變本乎天爻變本乎地倒卦反類象晝夜互卦之體象四時四時之氣溫涼交通晝夜之體明暗不同運乎上者旁周列位變乎下者各守一宫是故卦變存乎體爻變存乎用倒卦反類存乎序互卦之體存乎辭本乎天地自然者也倒卦反類使然者也互卦之體或然者也爻變窮乎六卦變窮乎八倒卦窮乎上下之相似互變窮乎有象而義或無所取也然而無互體則辭不擬無倒卦則序不比無反類則倒卦有時而弊無卦變爻變則易象或幾乎毁矣有象篇第八聖人立象所以盡意繫而為辭乃不得已蓋有象然後有卦有卦然後有辭辭也者象之華而爻之末也如物之生有本然後有實有實然後有味味也者乃木之末而非其本也溺於辭而忘其象是甘於味而棄其本也彼不知味之嘗也有盡而本之生也無窮辭之旨也有盡而象之擬也無窮聖人以一言而名卦之體而卦之體未必盡於一言以數辭而通卦之用而卦之用未必殫於數辭神而明之存乎其人者象而已矣苟明乎象則天地之大可坐而窺鬼神之奧可默而知而卦之名有可以自擬爻之辭有可以自揆聖人之已言者可曉然而無疑其未言者可以類而推之故曰聖人立象以盡意苟明乎象則理罔不通苟泥其辭則勢罔不窮象有幾有易之象有卦之象有爻之象天地風雷水火山澤易之象也木上有水謂之井頤中有物謂之噬嗑此卦之象也渙以機剝指牀困取赤紱坤言黃裳此爻之象也是故卦之中又有卦焉象之中又有象焉象無窮故意無窮意無窮故辭無窮自本而觀之一以貫自末而觀之萬不同求彖篇第九成卦之體不在一隅求彖之端不可一途女正位乎內男正位乎外家人也而卦中有六二九五者多矣豈皆可謂之家人乎柔來而文剛分剛上而文柔賁也而內卦有柔外卦有剛者亦多矣豈皆可謂之賁乎蓋家人賁者其象各三而此特其一也家道以婦人為主而巽為長女離為中女長女在上中女在下其義一也家道尚嚴內明而外巽由中及外火烈而風行其義二也女正位乎內男正位乎外其義三也賁以受色為主物不止則不能受色艮止而離明其義一也火盛於山因山而成色山下有火其義二也柔來而文剛分剛上而文柔其義三也如止以男女位正冝莫如既濟而坎上離下不可以為家人也如止以剛柔相交冝莫如未濟而離上坎下不可以為賁也故彖也者特因其卦而明其德非謂卦之德止於此而已也歷觀衆卦之德有舉其一有舉其二有舉其三如險而止蒙順以動豫此舉其一者也如履柔履剛既指三而言履帝位而不疚又指五而言此舉其二者也如巽乎水而上水井蓋取諸汲改邑不改井乃取諸剛中木上有水井乃取諸養而不窮是舉其三者也卦舉其三可謂詳矣而先儒猶有隂陽虛實動靜之説以謂陽虛而靜故在初為泥在四為甃在上為收陽實而動故在二為射鮒在三為泄在五為寒泉是舉其三者義猶未盡而況舉其一二者乎易璇璣卷上
