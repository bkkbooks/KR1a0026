body:
  text: 易璇璣易類提要臣等謹案易璇璣三卷宋吳沆撰沆字徳逺臨川人紹興十六年與其弟澥詣行在獻書澥所獻曰宇内辨曰厯代疆域志沆所獻曰易璇璣曰三墳訓義澥書皆不傳沆三墳訓義為太學博士王之望所駁亦不傳惟此書僅存凡為論二十有七曰法天曰通六子曰貴中曰初上定位曰六九定名曰天地變卦曰論變有四曰有象曰求彖曰明位曰明君道曰明君子曰論養曰論刑曰論伐曰辨聖曰辨内外曰辨吉凶曰通卦曰通象曰通爻曰通詞曰通證曰釋卦曰釋繫曰存互體曰廣演每九篇為一卷自序謂上卷明天理之自然中卷講人事之修下卷偹𫝊疏之失其大㫖主於觀彖因彖而求之卦求之象求之爻其曰璇璣者取王弼易畧例明彖篇處璇璣以觀大運語也胡一桂稱沆尚有易禮圖説有或問六條圗説十二軸今未見其書殆亦散佚惟其環溪詩話為人所記者尚載永樂大典中今别著録於集部云乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀易璇璣序臣自少學易病其難明求諸聖人之言曰知者觀其彖辭則思過半矣又求諸明彖之言曰處璇璣以觀大運則天地之動未足怪也臣自是誦易之彖浸歷歲時渙然氷釋然後知自彖而求易無不得捨彖而求易無不惑彖也者易之門户而象之管鑰也臣學彖既有所省以次求之卦求之象求之爻稍見諸儒缺失因拾其餘遺竊為議論以謂易之道莫大於乾坤而聖人以天為法乃作法天六子之用初無定體變而通之存乎其人作通六子乾坤六子皆以中道為貴作貴中中也者二五之位也而六爻之位互分隂陽去其初上則不足以成章作初上定位踐其位者非六即九也六九之名當定於自然而先儒以人事加之於理未安作六九定名位既定則六十四變決非偶然作天地變卦卦變之説不一而足先儒考傳或失其正論其至當不過有四作論變有四泥于辭不知象之可貴則不見天地之藴奥作有象明象之端莫先於彖作求彖聖人之作易非直為卜筮而已所以崇帝王之德業辨君臣之名位而定君子小人之分也乃作明位明君道明君子君子之德足以養人然後刑可議刑可議而後伐可致作論養論刑論伐蓋聖人之旨不明於天下則教道不立教道不立内外不分而吉凶無辨也作辨聖辨内外辨吉凶易之為道變動不居卦無定象爻無定辭不可以有執也乃作通卦通象通爻通辭苟期乎通而無一定為證則失之汎汎無統作通證事有一定而未免於疑者重卦繫辭是也作釋卦釋繫互體之説雖不可泥而亦不可廢作存互體如是而易略備矣凡物既備則當思其未備者以廣之作廣演而終焉凡二十七篇分為三卷上以明天理之自然中以講人事之修下以備傳疏之失庶幾上補聖時崇廣經術之意名之曰易璇璣云紹興十六年夏五月撫州布衣臣吳沆謹序
